<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Orthogonal Interactive — AR (SLAM)</title>
    <meta name="robots" content="noindex" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #0b1211; color: #dbe7e6;
                   font-family: ui-monospace, Menlo, monospace; overflow: hidden; touch-action: none; }
      #scene { position: fixed; inset: 0; }
      #scene canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      #log { position: fixed; top: 0; left: 0; margin: 0; padding: .6rem .8rem; z-index: 20; max-width: 100%;
             background: rgba(11,18,17,.82); font-size: .62rem; line-height: 1.6; white-space: pre-wrap; }
      #go { position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); z-index: 20;
            padding: .85rem 1.6rem; border: none; border-radius: 999px; background: #8fd3e8; color: #070c0b;
            font: inherit; font-size: .9rem; }
      #go[hidden] { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" async crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <div id="scene"></div>
    <pre id="log">engine を読み込み中… (約2.2MB)</pre>
    <button id="go" type="button" disabled>カメラを開始</button>

    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      window.THREE = THREE   // XR8.Threejs reads the global rather than an import

      const logEl = document.querySelector('#log')
      const lines = []
      const live = { pose: '-', image: 'まだ', anchored: false, w: '-', s: '-', cat: '-' }
      const say = (...p) => { lines.push(p.join(' ')); if (lines.length > 8) lines.shift(); paint() }
      // These two are what the fit is dialled in with, so they stay on screen
      // rather than scrolling out of the message list.
      const paint = () => {
        logEl.textContent = lines
          .concat([
            '',
            `w ${live.w}  s ${live.s}  猫 ${live.cat}`,
            `マーカー: ${live.image}`,
            `固定: ${live.anchored ? 'YES' : 'no'}`,
            `camera ${live.pose}`,
          ])
          .join('\n')
      }
      addEventListener('error', (e) => say('ERROR:', e.message))
      addEventListener('unhandledrejection', (e) => say('REJECTED:', e.reason?.message ?? e.reason))

      const waitFor = (name, event) => new Promise((resolve) => {
        if (window[name]) return resolve(window[name])
        addEventListener(event, () => resolve(window[name]), { once: true })
      })

      const t0 = performance.now()
      const [XR8, XRExtras] = await Promise.all([
        waitFor('XR8', 'xrloaded'), waitFor('XRExtras', 'xrextrasloaded'),
      ])
      say(`engine: ${((performance.now() - t0) / 1000).toFixed(1)}s | three ${THREE.REVISION}`)
      const est = XR8.XrDevice.deviceEstimate()
      say(`${est.os} ${est.osVersion} / ${est.browser?.name}`,
          '| compatible:', XR8.XrDevice.isDeviceBrowserCompatible())

      const [target, gltf] = await Promise.all([
        fetch('/xr2/card-target.json').then((r) => r.json()),
        new GLTFLoader().loadAsync('/xr/cat.glb'),
      ])

      // Monocular SLAM has no scale of its own. Telling the engine how wide the
      // printed mark really is, and asking for absolute scale, is what makes
      // the parallax of the virtual object match the real card as you move.
      const params = new URLSearchParams(location.search)
      const markWidth = Number(params.get('w')) || 0.024
      // At true scale the cat is only as big as the card says, so how much
      // larger than the mark it should read is worth having to hand.
      const sizeFactor = Number(params.get('s')) || 1.5
      target.physicalWidthInMeters = markWidth
      target.moveable = false
      live.w = `${(markWidth * 1000).toFixed(0)}mm`
      live.s = String(sizeFactor)
      say('target & model ready |', gltf.animations.length, 'clip')
      say('?w= マーカー実寸 / ?s= 猫の倍率')
      paint()

      const go = document.querySelector('#go')
      go.disabled = false
      say('', '名刺のマークにカメラを向けてください。')

      go.addEventListener('click', () => {
        go.hidden = true
        const canvas = document.createElement('canvas')
        document.querySelector('#scene').appendChild(canvas)

        const clock = new THREE.Clock()
        let mixer = null
        let anchor = null      // holds the cat, placed once in world space
        let rise = 0           // 0..1 climb out of the card
        let modelHeight = 1
        const clipPlane = new THREE.Plane()

        // scale must be set before XR8.run(); the engine refuses it after.
        XR8.XrController.configure({
          disableWorldTracking: false,
          scale: 'absolute',
          imageTargetData: [target],
        })

        XR8.addCameraPipelineModules([
          XR8.GlTextureRenderer.pipelineModule(),
          XR8.Threejs.pipelineModule(),
          XR8.XrController.pipelineModule(),
          XRExtras.FullWindowCanvas.pipelineModule(),
          XRExtras.AlmostThere.pipelineModule(),
          XRExtras.Loading.pipelineModule(),
          XRExtras.RuntimeError.pipelineModule(),
          XRExtras.PauseOnHidden.pipelineModule(),
          {
            name: 'orthogonal',
            onStart: () => {
              const { scene, renderer } = XR8.Threejs.xrScene()
              scene.add(new THREE.AmbientLight(0xbcd6de, 1.3))
              const key = new THREE.DirectionalLight(0xdff0f6, 2)
              key.position.set(1, 3, 2)
              scene.add(key)
              renderer.localClippingEnabled = true
              say('パイプライン開始')
            },
            onException: (e) => say('EXCEPTION:', e?.message ?? e),
            onUpdate: ({ processCpuResult }) => {
              const delta = clock.getDelta()
              mixer?.update(delta)
              if (anchor && rise < 1) {
                rise = Math.min(1, rise + delta / 1.4)
                const eased = 1 - (1 - rise) ** 3
                anchor.children[0].position.y = (eased - 1) * modelHeight
                // Cut at the card so the cat climbs out of the print.
                anchor.updateMatrixWorld(true)
                const normal = new THREE.Vector3().setFromMatrixColumn(anchor.matrixWorld, 1).normalize()
                const origin = new THREE.Vector3().setFromMatrixPosition(anchor.matrixWorld)
                clipPlane.setFromNormalAndCoplanarPoint(normal, origin)
              }
              const r = processCpuResult.reality
              if (!r) return
              const p = r.position
              live.pose = `${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)} ${r.trackingStatus}`
              paint()
            },
            listeners: [
              { event: 'reality.imageloading', process: () => say('マーカー読み込み中…') },
              { event: 'reality.imagescanning', process: () => { live.image = '探索中'; paint() } },
              {
                event: 'reality.imagefound',
                process: ({ detail }) => {
                  live.image = `検出 (${detail.name})`
                  if (anchor) return paint()

                  // Report what the engine actually hands over: the size the
                  // object ends up is only as trustworthy as these numbers.
                  const num = (v) => (typeof v === 'number' ? v.toFixed(4) : String(v))
                  say('detail:', Object.keys(detail).join(','))
                  say(`scaledW=${num(detail.scaledWidth)} scaledH=${num(detail.scaledHeight)} scale=${num(detail.scale)}`)
                  const dp = detail.position
                  say(`pos ${num(dp?.x)},${num(dp?.y)},${num(dp?.z)}`,
                      `| dist ${Math.hypot(dp?.x ?? 0, dp?.y ?? 0, dp?.z ?? 0).toFixed(3)}`)

                  // Place once, then let SLAM hold it: the card is an anchor
                  // for the coordinate system, not a marker to keep chasing.
                  const { scene } = XR8.Threejs.xrScene()
                  anchor = new THREE.Group()
                  anchor.position.copy(detail.position)
                  anchor.quaternion.copy(detail.rotation)
                  scene.add(anchor)

                  const cat = gltf.scene
                  const box = new THREE.Box3()
                  const tmp = new THREE.Box3()
                  cat.traverse((c) => {
                    if (!c.isMesh) return
                    if (!c.geometry.boundingBox) c.geometry.computeBoundingBox()
                    tmp.copy(c.geometry.boundingBox).applyMatrix4(c.matrixWorld)
                    box.union(tmp)
                    c.frustumCulled = false
                    c.material.emissiveMap = c.material.map
                    c.material.emissive = new THREE.Color(0xffffff)
                    c.material.emissiveIntensity = 0.7
                    c.material.clippingPlanes = [clipPlane]
                  })
                  const size = new THREE.Vector3()
                  box.getSize(size)
                  // A bit wider than the printed mark, as on the old page.
                  // detail.geometry.scaledWidth is an aspect ratio, not a size
                  // — the real width is the one we declared on the target.
                  const across = markWidth
                  const scale = (across * sizeFactor) / Math.max(size.x, size.z)
                  cat.scale.setScalar(scale)
                  modelHeight = size.y * scale
                  cat.position.y = -modelHeight
                  anchor.add(cat)

                  if (gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(cat)
                    gltf.animations.forEach((c) => mixer.clipAction(c).play())
                  }
                  live.anchored = true
                  live.cat = `${(across * sizeFactor * 1000).toFixed(0)}mm`
                  say('固定しました')
                  paint()
                },
              },
              { event: 'reality.imagelost', process: () => { live.image = 'ロスト（固定は継続）'; paint() } },
            ],
          },
        ])

        say('XR8.run() …')
        XR8.run({ canvas })
      })
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/org-icon.png" />
    <title>Orthogonal Interactive — AR statistics</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stats">
      <h1 class="stats__title">AR ページのアクセス</h1>

      <dl class="stats__figures">
        <div class="stats__figure">
          <dt>総アクセス数</dt>
          <dd id="total" class="stats__number">—</dd>
        </div>
        <div class="stats__figure">
          <dt>ユニーク端末数</dt>
          <dd id="unique" class="stats__number">—</dd>
        </div>
        <div class="stats__figure stats__figure--mine">
          <dt>この端末から</dt>
          <dd id="mine" class="stats__number">—</dd>
        </div>
      </dl>

      <p id="note" class="stats__note">読み込み中…</p>

      <p class="stats__small">
        端末はブラウザが自分で作った ID で数えています。同じ端末でもブラウザが違えば別に数え、サイトデータを消すとリセットされます。
      </p>

      <a class="stats__back" href="/xr/">← AR ページ</a>
    </main>
    <script type="module" src="/src/xr/stats.js"></script>
  </body>
</html>

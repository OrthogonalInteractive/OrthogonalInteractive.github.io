name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: node-canvas builds a native module against system
      # libraries this runner does not have. Nothing in the build or the tests
      # uses it — it only backs `npm run make:image-target`, which runs locally
      # and whose output (public/xr/image-targets/) is committed.
      - run: npm ci --ignore-scripts
      - run: npm test
      # A repository variable, not a secret: a Firebase web config is readable
      # in any page that uses it. Unset, and the site simply counts nothing.
      - run: npm run build
        env:
          VITE_FIREBASE: ${{ vars.FIREBASE_CONFIG }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
